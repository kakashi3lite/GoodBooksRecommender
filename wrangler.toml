# Cloudflare Pages configuration
# Deploy: `npm run deploy` (or via GitHub Actions — see .github/workflows/cloudflare-pages.yml)

name = "goodbooks-recommender"
compatibility_date = "2025-01-01"

# The Vite build output directory (public/ contents are merged into dist/)
pages_build_output_dir = "./dist"

# Production branch — pushes to this branch auto-deploy via CI
[env.production]

# ═════════════════════════════════════════════════════════════════════════════
# Runtime environment (set in the Pages dashboard → Settings → Environment
# variables, or via the Cloudflare API). See docs/DATA_LAYER.md.
#
#   Server-side (Pages Functions only — never shipped to the browser):
#     SUPABASE_URL              https://<project-ref>.supabase.co
#     SUPABASE_SERVICE_ROLE_KEY Settings → API → service_role
#     AI_PROVIDER               openai | (any OpenAI-compatible)
#     AI_API_KEY                optional LLM key for /api/ai/chat
#     AI_MODEL                  e.g. gpt-4o-mini
#     AI_BASE_URL               optional custom endpoint for AI_PROVIDER
#
#   Build-time (baked into the browser bundle):
#     VITE_SUPABASE_URL         same URL (accounts + realtime)
#     VITE_SUPABASE_ANON_KEY    Settings → API → anon (public key)
# ═════════════════════════════════════════════════════════════════════════════

