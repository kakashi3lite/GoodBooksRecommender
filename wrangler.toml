# Cloudflare Pages configuration
# Deploy: `npm run deploy` (or via GitHub Actions — see .github/workflows/cloudflare-pages.yml)

name = "goodbooks-recommender"
compatibility_date = "2025-01-01"

# The Vite build output directory (public/ contents are merged into dist/)
pages_build_output_dir = "./dist"

# ═════════════════════════════════════════════════════════════════════════════
# Non-secret runtime vars. Declaring them here (not only in the dashboard)
# guarantees every `wrangler pages deploy` ships them to the Functions runtime.
# Secrets (API keys, service-role keys) are set with `wrangler pages secret put`.
# ═════════════════════════════════════════════════════════════════════════════
[vars]
SUPABASE_URL = "https://rqorywqrimcsgekmsxmj.supabase.co"

# ═════════════════════════════════════════════════════════════════════════════
# Customer accounts — Cloudflare D1 (see d1/schema.sql, docs/DATA_LAYER.md)
# Bound to Pages Functions as `env.DB`. Apply the schema with:
#   npx wrangler d1 execute goodbooks-accounts --remote --file=d1/schema.sql
# ═════════════════════════════════════════════════════════════════════════════
[[d1_databases]]
binding = "DB"
database_name = "goodbooks-accounts"
database_id = "1e12a45a-6514-48df-ab1b-dcd3d1dff5cb"

# NOTE: there is intentionally no [env.production] block. Cloudflare Pages
# reads production settings (branch, env vars, project name) from the Pages
# project itself; an empty `[env.production]` table is a no-op that only
# suggests there is per-environment config to look for.

# ═════════════════════════════════════════════════════════════════════════════
# Runtime environment (set in the Pages dashboard → Settings → Environment
# variables, or via the Cloudflare API). See docs/DATA_LAYER.md.
#
#   Server-side (Pages Functions only — never shipped to the browser):
#     SUPABASE_URL                https://<project-ref>.supabase.co
#     SUPABASE_ANON_KEY           publishable/anon key (public, browser-safe)
#     SUPABASE_SERVICE_ROLE_KEY   service-role/secret key — MUST be set as a
#                                 Cloudflare secret (secret_text), never in the
#                                 repo or the browser bundle
#     SUPABASE_JWKS_URL           https://<ref>.supabase.co/auth/v1/.well-known/jwks.json
#                                 (for verifying user JWTs server-side)
#     AI_PROVIDER                 openai (default) | any OpenAI-compatible
#     MINIMAX_API_KEY             MiniMax subscription key (secret) — live
#                                 provider; auto-selects MiniMax defaults
#     OPENAI_API_KEY              OpenAI key (sk-...) — legacy AI_API_KEY too
#     AI_MODEL                    e.g. gpt-4o-mini, MiniMax-M2
#     AI_BASE_URL                 custom endpoint, e.g. https://api.minimax.io/v1
#
#   Build-time (baked into the browser bundle):
#     VITE_SUPABASE_URL         same URL (accounts + realtime)
#     VITE_SUPABASE_ANON_KEY    Settings → API → anon (public key)
# ═════════════════════════════════════════════════════════════════════════════

