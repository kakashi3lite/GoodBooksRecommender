# 🚀 Cloudflare Pages — the single authoritative pipeline
# Pushes to `main` build the app and deploy it to Cloudflare Pages.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   (Pages:Edit + D1:Edit — the D1 binding for
#                           /api/accounts is read from wrangler.toml at deploy time)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare account id)
#
# Chain-of-Thought: this workflow is the ONLY pipeline for the deployed
# product. Three legacy pipelines (ci-cd.yml, production-cicd.yml,
# quality-assurance.yml) targeted the un-deployed Python/Terraform stack,
# hard-failed on every push because they pinned `actions/upload-artifact@v3`,
# and duplicated the gates below — so CI was red on every commit and its
# signal was worthless. They were removed; git history retains them if the
# FastAPI/Kubernetes path is ever revived.
# Gates run here, in order: type-check → lint → test → build → purge → deploy
# → live smoke test. `ci.yml` gates pull requests before they can merge, so a
# broken branch never reaches this production deploy.
#
# Actions are pinned to commit SHAs (supply-chain hardening): a mutable major
# tag can be repointed at different code after review.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer push supersedes an in-flight run: Cloudflare
# Pages deploys are atomic, so cancelling never leaves a half-published site —
# it just guarantees the newest commit is the one that goes live.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 (used by Vitest) requires Node >= 22 — undici bundled in
          # Node 20 lacks webidl.util.markAsUncloneable, which made the whole
          # suite error out before running a single test on CI while passing
          # locally on Node 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Type-check Functions
        run: npm run type-check:functions

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Docs links
        run: npm run docs:check

      - name: Build
        run: npm run build

      # macOS Apple Double files (`._*`) are not valid JS and break the
      # Functions bundle. CI is Linux, but this keeps the pipeline identical to
      # a local `npm run deploy` (both run the same purge script).
      - name: Purge Apple Double files
        run: node scripts/purge-apple-double.cjs

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name goodbooks-recommender --branch main

      # A green "Deploying..." line is not proof the site works. Verify the
      # freshly published deployment actually serves the app shell and a live
      # API response.
      #
      # Chain-of-Thought (learned the hard way): each check must make ONE
      # request and assert status AND body from that same response. Pages
      # Functions come up per-edge — a retry can succeed on one PoP while the
      # next request lands on another PoP that still 404s the route. Two
      # sequential curls therefore raced, and a healthy deployment failed
      # twice. One request, one verdict, retried until both hold.
      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: https://books.dalecabra.com
        run: |
          set -euo pipefail

          # usage: assert_serves <url> <label> <pattern> <body-file>
          assert_serves() {
            local url="$1" label="$2" pattern="$3" body="$4" code=000
            for attempt in $(seq 1 9); do
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "$url") || code=000
              if [ "$code" = "200" ] && grep -q -- "$pattern" "$body" 2>/dev/null; then
                echo "ok   $label — HTTP 200, body matched /$pattern/"
                return 0
              fi
              echo "wait $label — attempt $attempt: HTTP $code"
              sleep 5
            done
            echo "::error::$label failed (last HTTP $code) — $url"
            return 1
          }

          target="${DEPLOYMENT_URL:-$PRODUCTION_URL}"
          echo "Deployment URL: ${DEPLOYMENT_URL:-<none reported>}"

          # 1. The new deployment serves the real app shell (not a fallback page).
          assert_serves "$target/" "deployment shell" 'id="root"' /tmp/shell.html

          # 2. Its edge API answers with real JSON.
          assert_serves "$target/api/books" "deployment api" '"data":' /tmp/books.json
          head -c 140 /tmp/books.json; echo

          # 2b. The D1 binding for customer accounts is live (a missing binding
          # answers 503 "database_not_configured" instead of this payload).
          assert_serves "$target/api/accounts" "accounts api" '"database":"d1"' /tmp/accounts.json
          head -c 140 /tmp/accounts.json; echo

          # 3. The canonical custom domain serves the promoted build.
          assert_serves "$PRODUCTION_URL/" "custom domain" 'id="root"' /tmp/prod.html

          echo "Smoke test passed."
