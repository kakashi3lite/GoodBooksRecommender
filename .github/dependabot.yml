# 🤖 Dependabot — keep the supply chain fresh without surprise majors
#
# Chain-of-Thought:
#   Actions in both workflows are pinned to commit SHAs (immutable, the
#   recommended hardening). The cost of SHA pinning is that the pins rot
#   silently — Dependabot is what turns a static pin into a maintained one.
#
#   Both ecosystems are grouped so a routine week produces ONE PR per ecosystem
#   (each still running the full `CI / verify` gate) instead of a dozen.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps of the UI stack are migrations, not maintenance — they
      # need a planned pass (React 19, Tailwind 4, Redux Toolkit 2, Vitest 1+).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: "@reduxjs/toolkit"
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      # The ESLint 9 migration has landed (eslint 9.39 + typescript-eslint 8 +
      # react-refresh 0.5), so plugin, @eslint/js and typescript-eslint bumps are
      # allowed again — those were the PRs that used to fail `npm ci`.
      # Remaining pin: eslint itself at 9.x and eslint-plugin-react at 7.x,
      # because eslint-plugin-react 7.37 peers on `eslint ^9.7` and is the last
      # published major. Bumping ESLint to 10 breaks that peer range, so it
      # waits for a react-plugin release (tracked as a planned pass).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: eslint-plugin-react
        update-types: [version-update:semver-major]
      # `@eslint/js` ships in lockstep with the `eslint` major (it peers on
      # `eslint ^10` next) and Dependabot cannot bump both in one PR, so a lone
      # `@eslint/js` major fails `npm ci` with ERESOLVE. It moves when ESLint
      # moves, never before.
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # Same story: plugin-react 6 requires vite ^8, and @vitest/ui must match
      # the vitest major exactly (5.1.0 needs vitest 5.1.0). Both belong to the
      # Vite 5 -> 8 / Vitest 0.34 -> 5 migration, which is a planned pass.
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/ui"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
